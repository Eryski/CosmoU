# Builds the Windows installer + portable .exe and attaches them to a GitHub Release.
# How to use: on GitHub go to Releases → "Draft a new release", create a tag like v0.8.1
# (it should match the version in package.json) and press "Publish release".
# The build starts automatically and the two .exe files appear in the release after a few minutes.
name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build installer and portable exe
        run: npm run dist

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CosmoU-Setup-*.exe
            dist/CosmoU-Portable-*.exe
