# Builds CosmoU for Windows (installer + portable .exe), Linux (AppImage, .deb, .tar.gz), macOS (.dmg) and Android (.apk)
# and attaches the files to a GitHub Release.
# How to use: on GitHub go to Releases → "Draft a new release", create a tag like v0.12.0
# (it should match the version in package.json) and press "Publish release".
# The builds start automatically and the files appear in the release after a few minutes.
# "Run workflow" (manual start) builds and keeps the files as a download on the run page.
# With a tag in "to_release" (for example v0.11.2) it also attaches the files to that existing release.
name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      to_release:
        description: Add the files to this release (tag like v0.11.2, empty = only build)
        required: false
        default: ''
      platforms:
        description: Which builds to make (windows, linux, mac, android – empty = all)
        required: false
        default: ''

permissions:
  contents: write
  checks: write

jobs:
  windows:
    if: github.event_name == 'release' || inputs.platforms == '' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build installer and portable exe
        run: npm run dist

      - name: Keep the files on the run page
        uses: actions/upload-artifact@v4
        with:
          name: cosmou-windows
          path: |
            dist/CosmoU-Windows-Setup-*.exe
            dist/CosmoU-Windows-Portable-*.exe

      - name: Attach files to the release
        if: github.event_name == 'release' || inputs.to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.to_release }}
          files: |
            dist/CosmoU-Windows-Setup-*.exe
            dist/CosmoU-Windows-Portable-*.exe

  linux:
    if: github.event_name == 'release' || inputs.platforms == '' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build AppImage, .deb and .tar.gz
        run: npm run dist:linux

      - name: Check the packages
        run: |
          ls -la dist
          test -f dist/CosmoU-Linux-*.AppImage
          test -f dist/CosmoU-Linux-*.deb
          test -f dist/CosmoU-Linux-*.tar.gz
          # the launcher script starts the real program and must be in every package
          test -x dist/linux-unpacked/cosmou && head -1 dist/linux-unpacked/cosmou | grep -q '^#!/bin/sh'
          test -x dist/linux-unpacked/cosmou-bin
          dpkg-deb -c dist/CosmoU-Linux-*.deb | grep -q 'opt/CosmoU/cosmou-bin'

      - name: Start CosmoU once (smoke test)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          chmod +x dist/CosmoU-Linux-*.AppImage
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          xvfb-run -a timeout 25 dist/CosmoU-Linux-*.AppImage --appimage-extract-and-run || code=$?
          # 124 = still running after 25 seconds, which means it started fine
          echo "exit code: ${code:-0}"
          test "${code:-0}" = "124"
          test -f "$HOME/.config/CosmoU/settings.json" -o -d "$HOME/.config/CosmoU"

      - name: Test CosmoU on this computer
        id: e2e
        continue-on-error: true
        run: |
          # what a normal desktop already has: OpenGL / Vulkan libraries (software drivers here) and FUSE for AppImages
          sudo apt-get install -y xvfb imagemagick libopengl0 libgl1 libegl1 libvulkan1 mesa-vulkan-drivers libfuse2 >/dev/null
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2
          PW_PATH="$RUNNER_TEMP/pw/node_modules/playwright-core" CEMU_DOWNLOAD=1 COSMOU_GITHUB_TOKEN="${{ github.token }}" \
            xvfb-run -a -s "-screen 0 1280x800x24" node scripts/ci/e2e.js "$PWD/dist/linux-unpacked/cosmou-bin" "$RUNNER_TEMP/e2e"

      - name: Report the test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in "$RUNNER_TEMP"/e2e/*.png; do [ -f "$f" ] && convert "$f" -resize 720x -quality 40 "${f%.png}.jpg"; done
          node scripts/ci/report.js "$RUNNER_TEMP/e2e" linux

      - name: Keep the files on the run page
        uses: actions/upload-artifact@v4
        with:
          name: cosmou-linux
          path: |
            dist/CosmoU-Linux-*.AppImage
            dist/CosmoU-Linux-*.deb
            dist/CosmoU-Linux-*.tar.gz

      - name: Attach files to the release
        if: github.event_name == 'release' || inputs.to_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.to_release }}
          files: |
            dist/CosmoU-Linux-*.AppImage
            dist/CosmoU-Linux-*.deb
            dist/CosmoU-Linux-*.tar.gz

  mac:
    if: github.event_name == 'release' || inputs.platforms == '' || contains(inputs.platforms, 'mac')
    # Apple silicon Mac; the .dmg is universal (Apple silicon and Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build the .dmg
        run: npm run dist:mac

      - name: Check the package
        run: |
          ls -la dist
          test -f dist/CosmoU-macOS-*.dmg
          APP="dist/mac-universal/CosmoU.app"
          lipo -archs "$APP/Contents/MacOS/CosmoU"
          lipo -archs "$APP/Contents/MacOS/CosmoU" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/CosmoU" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
          # install it the way people do: open the .dmg and copy CosmoU into Applications
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/cosmou-dmg dist/CosmoU-macOS-*.dmg
          ls -la /tmp/cosmou-dmg
          test -d /tmp/cosmou-dmg/CosmoU.app
          codesign --verify --deep --strict /tmp/cosmou-dmg/CosmoU.app
          ditto /tmp/cosmou-dmg/CosmoU.app /Applications/CosmoU.app
          hdiutil detach /tmp/cosmou-dmg

      - name: Test CosmoU on this Mac
        id: e2e
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2
          PW_PATH="$RUNNER_TEMP/pw/node_modules/playwright-core" CEMU_DOWNLOAD=1 COSMOU_GITHUB_TOKEN="${{ github.token }}" \
            node scripts/ci/e2e.js /Applications/CosmoU.app/Contents/MacOS/CosmoU "$RUNNER_TEMP/e2e"

      - name: Report the test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in "$RUNNER_TEMP"/e2e/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 40 -Z 720 "$f" --out "${f%.png}.jpg" >/dev/null
            # keep every picture small enough for a note on the check (64 KB)
            [ $(wc -c < "${f%.png}.jpg") -gt 46000 ] && sips -s format jpeg -s formatOptions 25 -Z 560 "$f" --out "${f%.png}.jpg" >/dev/null
          done
          node scripts/ci/report.js "$RUNNER_TEMP/e2e" mac

      - name: Keep the files on the run page
        uses: actions/upload-artifact@v4
        with:
          name: cosmou-mac
          path: |
            dist/CosmoU-macOS-*.dmg
            ${{ runner.temp }}/e2e

      - name: Attach files to the release
        if: steps.e2e.outcome == 'success' && (github.event_name == 'release' || inputs.to_release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.to_release }}
          files: dist/CosmoU-macOS-*.dmg

      - name: Stop if the test failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1

  android:
    if: github.event_name == 'release' || inputs.platforms == '' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # The same key must sign every version, otherwise Android refuses the update.
      # Save it once as the repository secrets COSMOU_KEYSTORE_B64 and COSMOU_KEYSTORE_PASSWORD;
      # without them a new key is made for this build only.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.COSMOU_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.COSMOU_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/cosmou.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
          else
            echo "::warning::No signing key saved in the repository secrets – this APK uses a key made just for this build."
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$KS" -alias cosmou -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CosmoU, O=ErykBS"
          fi
          echo "::add-mask::$PASS"
          echo "COSMOU_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "COSMOU_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          set -o pipefail
          {
            set -e
            gradle -p android --no-daemon --console=plain :app:assembleRelease :cemustub:assembleDebug
            VERSION=$(node -p "require('./package.json').version")
            mkdir -p dist
            ls -la android/app/build/outputs/apk/release
            cp android/app/build/outputs/apk/release/app-release.apk "dist/CosmoU-Android-$VERSION.apk"
            cp android/cemustub/build/outputs/apk/debug/cemustub-debug.apk "$RUNNER_TEMP/cemu-stub.apk"
            ls -la dist
            unzip -l "dist/CosmoU-Android-$VERSION.apk" | grep -E "assets/www/(index.html|js/core.js|css/)" | head
            TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$TOOLS/apksigner" verify --print-certs "dist/CosmoU-Android-$VERSION.apk" | head -3
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show what went wrong in the build
        if: failure()
        run: node scripts/ci/log-note.js "$RUNNER_TEMP/build.log" "Android build"

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test CosmoU on the Android emulator
        id: e2e
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          # the picture is drawn inside Android itself, so a crash there can't take the whole emulator down
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash scripts/ci/android-run.sh

      - name: Report the test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v magick >/dev/null || command -v convert >/dev/null || sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          for f in "$RUNNER_TEMP"/e2e/*.png; do [ -f "$f" ] && "$IM" "$f" -resize 720x720 -quality 40 "${f%.png}.jpg"; done
          node scripts/ci/report.js "$RUNNER_TEMP/e2e" android

      - name: Keep the files on the run page
        uses: actions/upload-artifact@v4
        with:
          name: cosmou-android
          path: dist/CosmoU-Android-*.apk

      - name: Attach files to the release
        if: steps.e2e.outcome == 'success' && (github.event_name == 'release' || inputs.to_release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.to_release }}
          files: dist/CosmoU-Android-*.apk

      - name: Stop if the test failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
