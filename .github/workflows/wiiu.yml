# CosmoU for Wii U (an Aroma app, CosmoU.wuhb). Built once for CosmoU 0.13.0 and never updated:
# this workflow only runs when it is started by hand, the normal release builds (release.yml) never build it,
# and the app itself has no update check.
# "Run workflow" builds it and tests it in Cemu; with a tag in "to_release" it also adds the file to that release.
name: Wii U app (built once)

on:
  workflow_dispatch:
    inputs:
      to_release:
        description: Add CosmoU-WiiU.wuhb to this existing release (tag like v0.13.0, empty = only build and test)
        required: false
        default: ''
      release_notes:
        description: Also add the Wii U install notes to the release text (only the first time)
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: SDL2 for the Wii U
        shell: bash
        run: |
          # devkitPro's package server sometimes drops a download: try a few times
          ok=0
          for i in 1 2 3 4; do
            if dkp-pacman -Syu --noconfirm --needed wiiu-sdl2 wiiu-sdl2_image wiiu-sdl2_mixer wiiu-sdl2_ttf wiiu-curl ppc-zlib > pacman.log 2>&1; then ok=1; break; fi
            sleep 20
          done
          if [ $ok = 0 ]; then tail -15 pacman.log | sed 's/^/::error::/'; exit 1; fi
          $DEVKITPRO/portlibs/wiiu/bin/powerpc-eabi-pkg-config --libs SDL2_mixer SDL2_ttf SDL2_image sdl2 libcurl zlib
          $DEVKITPRO/portlibs/wiiu/bin/powerpc-eabi-pkg-config --libs --static libcurl

      - name: Fresh certificates for the shop's downloads
        run: (curl -sSfL -o /tmp/cacert.pem https://curl.se/ca/cacert.pem && grep -q "BEGIN CERTIFICATE" /tmp/cacert.pem && mv /tmp/cacert.pem wiiu/content/cacert.pem && sed -n 4p wiiu/content/cacert.pem) || echo "keeping the bundled ones"

      - name: Build CosmoU.wuhb
        shell: bash
        run: |
          set -o pipefail
          make -C wiiu -j4 2>&1 | tee build.log || { grep -iE "error|undefined|warning" build.log | head -25 | sed 's/^/::error::/'; tail -8 build.log | sed 's/^/::error::/'; exit 1; }
          ls -la wiiu/CosmoU.wuhb wiiu/CosmoU.rpx
          # function addresses, so a crash in Cemu can be named
          $DEVKITPPC/bin/powerpc-eabi-nm -C --numeric-sort wiiu/CosmoU.elf > wiiu/symbols.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: cosmou-wiiu
          path: |
            wiiu/CosmoU.wuhb
            wiiu/CosmoU.rpx
            wiiu/symbols.txt

  # the shop on a PC: the real catalogs, installing into a folder that stands in for the SD card, removing again
  shop-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shop test
        continue-on-error: true
        env:
          COSMO_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/
          SHOP_FULL: '1'
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev >/dev/null
          g++ -std=gnu++17 -O1 -Wall -I wiiu/source wiiu/source/shop.cpp scripts/ci/wiiu-shop-test.cpp -lcurl -lz -o shop-test
          mkdir -p "$RUNNER_TEMP/shop" "$RUNNER_TEMP/sd"
          SHOP_ROOT="$RUNNER_TEMP/sd/" ./shop-test "$RUNNER_TEMP/shop"
      - name: Report the shop test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/report.js "$RUNNER_TEMP/shop" wiiu-shop

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cosmou-wiiu
          path: out

      - name: Start it in Cemu
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/wiiu-cemu.sh "$PWD/out/CosmoU.wuhb" "$RUNNER_TEMP/wiiu" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/"

      - name: Report the test
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/report.js "$RUNNER_TEMP/wiiu" wiiu

  release:
    needs: [build, test, shop-test]
    if: inputs.to_release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cosmou-wiiu
          path: out
      - name: Name the file
        run: cp out/CosmoU.wuhb "out/CosmoU-WiiU-${TAG#v}.wuhb"
        env:
          TAG: ${{ inputs.to_release }}
      - name: Add it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.to_release }}
          files: out/CosmoU-WiiU-*.wuhb
          # the first time ("release_notes") the release text gets a short Wii U section (how to install it) at the end;
          # a file with the same name is replaced; the release text stays as it is
          body_path: ${{ inputs.release_notes && '.github/wiiu-release-notes.md' || '' }}
          append_body: ${{ inputs.release_notes }}
