<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>CosmoU Browser</title>
    <style>
      /* CosmoU's own browser: a calm bar in the Wii U Look's colours, the page below it (main.js webOpen) */
      :root {
        color-scheme: light dark;
        --bg: #f2f4f8;
        --card: #fff;
        --line: rgba(120, 130, 160, 0.28);
        --ink: #2b3140;
        --mute: #7a8294;
        --acc: #12b4cc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f28;
          --card: #262b37;
          --line: rgba(255, 255, 255, 0.12);
          --ink: #eef1f7;
          --mute: #9aa3b5;
        }
      }
      html,
      body {
        margin: 0;
        height: 56px;
        overflow: hidden;
        background: var(--bg);
        font: 15px/1.2 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }
      .bar {
        height: 56px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      button {
        flex: none;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      button:hover:not(:disabled),
      button:focus-visible {
        background: var(--card);
        box-shadow: 0 0 0 1px var(--line);
        outline: none;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      form {
        flex: 1;
        min-width: 0;
        margin: 0 4px;
      }
      input {
        width: 100%;
        height: 40px;
        box-sizing: border-box;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        color: var(--ink);
        background: var(--card);
        box-shadow: 0 0 0 1px var(--line);
      }
      input:focus {
        outline: none;
        box-shadow: 0 0 0 2px var(--acc);
      }
      .load {
        position: fixed;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 0;
        background: var(--acc);
        transition: width 0.4s;
      }
      body.loading .load {
        width: 70%;
        transition: width 6s cubic-bezier(0.1, 0.7, 0.3, 1);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="b" title="Back" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
      <button id="f" title="Forward" aria-label="Forward" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
      <button id="r" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg></button>
      <button id="h" title="Start page" aria-label="Start page"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9" /></svg></button>
      <form id="fm"><input id="u" spellcheck="false" autocomplete="off" placeholder="Search or type an address" aria-label="Address" /></form>
    </div>
    <div class="load"></div>
    <script>
      const $ = id => document.getElementById(id);
      $('b').onclick = () => web.back();
      $('f').onclick = () => web.fwd();
      $('r').onclick = () => web.reload();
      $('h').onclick = () => web.home();
      $('fm').onsubmit = e => {
        e.preventDefault();
        web.go($('u').value);
        $('u').blur();
      };
      web.onState(s => {
        $('b').disabled = !s.back;
        $('f').disabled = !s.fwd;
        if (document.activeElement !== $('u')) $('u').value = s.url || '';
        document.body.classList.toggle('loading', !!s.loading);
        document.title = (s.title ? s.title + ' – ' : '') + 'CosmoU Browser';
      });
    </script>
  </body>
</html>
