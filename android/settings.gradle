// CosmoU for Android: the CosmoU window (index.html, css, js) in an Android app.
// "cemustub" is only for the automatic test: a stand-in for Cemu for Android that shows what CosmoU sent it.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'CosmoU'
include ':app', ':cemustub'
